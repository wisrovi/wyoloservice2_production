version: '3.8'

services:

  gradio_launcher:
    image: wisrovi/train_service:worker_invoker_gradio_v1.0.0
    container_name: gradio_launcher_${WORKER_NAME:-default}
    restart: always
    ports:
      - "23433:7860"
    env_file:
      - ./control_host.env
      - ./user.env
    volumes:
      - /home/wyolo/train_service_results:/results
    networks:
      - train_service

networks:
  train_service:
    name: train_service
    external: true
