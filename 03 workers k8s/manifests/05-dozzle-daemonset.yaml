apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: wyolo-dozzle
  namespace: train-service
  labels:
    app.kubernetes.io/name: dozzle-log-viewer
    app.kubernetes.io/part-of: train-service2
    app.kubernetes.io/component: log-streaming-ui
spec:
  selector:
    matchLabels:
      app: wyolo-dozzle
  template:
    metadata:
      labels:
        app: wyolo-dozzle
    spec:
      priorityClassName: system-node-critical
      serviceAccountName: dozzle-sa
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node.kubernetes.io/disk-pressure"
          operator: "Exists"
        - key: "node.kubernetes.io/memory-pressure"
          operator: "Exists"
      containers:
        - name: dozzle
          image: amir20/dozzle:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              hostPort: 8888  # Accessible at http://localhost:8888 on each node
          env:
            - name: DOZZLE_MODE
              value: "k8s"
            - name: DOZZLE_NAMESPACE
              value: "train-service"
            - name: DOZZLE_LEVEL
              value: "info"
            - name: DOZZLE_ENABLE_ACTIONS
              value: "true"
          resources:
            requests:
              cpu: "50m"
              memory: "40Mi"
            limits:
              cpu: "250m"
              memory: "150Mi"
