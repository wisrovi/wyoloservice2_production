apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: wyolo-dozzle
  namespace: train-service
  labels:
    app.kubernetes.io/name: dozzle-log-viewer
    app.kubernetes.io/part-of: train-service2
    app.kubernetes.io/component: log-streaming-ui
spec:
  selector:
    matchLabels:
      app: wyolo-dozzle
  template:
    metadata:
      labels:
        app: wyolo-dozzle
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: dozzle
          image: amir20/dozzle:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          ports:
            - name: http
              containerPort: 8080
              hostPort: 8888  # Accessible at http://localhost:8888 on each node
          env:
            - name: DOZZLE_LEVEL
              value: "info"
          resources:
            requests:
              cpu: "50m"
              memory: "40Mi"
            limits:
              cpu: "250m"
              memory: "150Mi"
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run/docker.sock
      volumes:
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
            type: Socket
