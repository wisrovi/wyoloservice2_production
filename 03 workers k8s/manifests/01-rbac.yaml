# -------------------------------------------------------------
# RBAC for Worker Invoker (Scoped to wtrain-service namespace)
# -------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wyolo-invoker-sa
  namespace: wtrain-service
  labels:
    app.kubernetes.io/name: wyolo-invoker
    app.kubernetes.io/part-of: train-service2
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wyolo-invoker-role
  namespace: wtrain-service
rules:
  # Pod management for ephemeral YOLO executors
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Job management (alternative orchestration pattern)
  - apiGroups: ["batch"]
    resources: ["jobs", "jobs/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Config access
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wyolo-invoker-rolebinding
  namespace: wtrain-service
subjects:
  - kind: ServiceAccount
    name: wyolo-invoker-sa
    namespace: wtrain-service
roleRef:
  kind: Role
  name: wyolo-invoker-role
  apiGroup: rbac.authorization.k8s.io
---
# -------------------------------------------------------------
# RBAC for Dozzle Log Viewer (Read-only for streaming logs)
# -------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dozzle-sa
  namespace: wtrain-service
  labels:
    app.kubernetes.io/name: dozzle-log-viewer
    app.kubernetes.io/part-of: train-service2
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dozzle-log-viewer-clusterrole
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dozzle-log-viewer-binding
subjects:
  - kind: ServiceAccount
    name: dozzle-sa
    namespace: wtrain-service
roleRef:
  kind: ClusterRole
  name: dozzle-log-viewer-clusterrole
  apiGroup: rbac.authorization.k8s.io
